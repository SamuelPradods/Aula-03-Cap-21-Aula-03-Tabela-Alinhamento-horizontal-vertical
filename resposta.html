<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito - Alinhamento em Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
    
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;      
            vertical-align: middle;  
        }
    
        /* TAREFA 1: Alinhamento horizontal */
        .direita {
            text-align: right;
        }
    
        .esquerda {
            text-align: left;
        }
    
        /* TAREFA 2: Alinhamento vertical */
        .topo {
            vertical-align: top;
        }
    
        .baixo {
            vertical-align: bottom;
        }
    
        /* TAREFA 3: aumentar altura de uma linha */
        .linha-alta {
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Gabarito - Trabalhando com alinhamento</h1>
    <table>
        <tr> <!-- Primeira linha -->
            <td class="esquerda">A1</td>
            <td>B1</td>
            <td class="direita">C1</td>
        </tr>
        <tr class="linha-alta"> <!-- Segunda linha -->
            <td class="topo">A2</td>
            <td>B2</td>
            <td class="baixo">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="topo">B3</td>
            <td class="baixo">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="direita">1000</td> <!-- número alinhado à direita -->
            <td>C4</td>
        </tr>
    </table>
  
</body>
</html>
